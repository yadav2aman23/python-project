<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Training Lab</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #263b70, transparent 40%),
                radial-gradient(circle at bottom right, #173d4d, transparent 40%),
                #090d18;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            padding: 42px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 22px;
            background: rgba(18, 24, 40, .88);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 70px rgba(0,0,0,.45);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4f7cff, #6d4aff);
            font-size: 27px;
        }

        h1 {
            font-size: 29px;
            margin-bottom: 9px;
        }

        .subtitle {
            color: #9ba6bb;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .training {
            padding: 12px 14px;
            margin-bottom: 24px;
            border-radius: 10px;
            background: rgba(255, 184, 77, .08);
            border: 1px solid rgba(255, 184, 77, .2);
            color: #ffc76b;
            font-size: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #c8d0df;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #30394d;
            border-radius: 10px;
            outline: none;
            background: #111827;
            color: white;
            font-size: 14px;
            transition: .2s;
        }

        input:focus {
            border-color: #6487ff;
            box-shadow: 0 0 0 3px rgba(100,135,255,.12);
        }

        .password-input {
            padding-right: 70px;
        }

        .show-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #8290a8;
            cursor: pointer;
            font-size: 12px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 24px;
            font-size: 12px;
            color: #8f9bb0;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            width: auto;
            height: auto;
        }

        button.login {
            width: 100%;
            height: 51px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #557cff, #704cff);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        button.login:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(87,100,255,.25);
        }

      >!--  .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            background: rgba(70, 200, 130, .1);
            border: 1px solid rgba(70, 200, 130, .2);
            color: #72e0a1;
            font-size: 13px;
            text-align: center;
        }

-->
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #68748a;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        

        <h1>login Your Account</h1>

       <!-- <p class="subtitle">
            Sign in to continue to the Security Training Lab.
        </p>
-->
   <!--     <div class="training">
            ⚠ TRAINING ENVIRONMENT — Do not enter real credentials.
        </div>-->

        <form method="POST" action="/">

            <label for="email">Email address</label>

            <div class="input-group">
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="email"
                    autocomplete="off"
                    required
                >
            </div>

            <label for="password">Password</label>

            <div class="input-group">

                <input
                    id="password"
                    class="password-input"
                    type="password"
                    name="password"
                    placeholder="password"
                    autocomplete="off"
                    required
                >

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword()"
                >
                    SHOW
                </button>

            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

               <!-- <span>Training account</span>

            </div>-->

            <button class="login" type="submit">
                Sign in
            </button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

      <!--  <div class="footer">
            Authorized security awareness training environment
        </div>-->

    </div>

</div>

<script>
function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".show-btn");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "HIDE";
    } else {
        password.type = "password";
        button.textContent = "SHOW";
    }
}
</script>

</body>
</html>
